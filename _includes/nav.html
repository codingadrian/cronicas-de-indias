<header class="top">
  <div class="brand">
    <a class="name" href="{{ '/' | relative_url }}">Crónicas de Indias</a>
    <span class="tag mono">archivo abierto</span>
  </div>
  <nav class="sitenav">
    <a href="{{ '/documentos/' | relative_url }}"{% if page.url contains '/documentos/' %} class="active"{% endif %}>Documentos</a>
    <a href="{{ '/personas/' | relative_url }}"{% if page.url contains '/personas/' %} class="active"{% endif %}>Personas</a>
    <a href="{{ '/lugares/' | relative_url }}"{% if page.url contains '/lugares/' %} class="active"{% endif %}>Lugares</a>
    <a href="{{ '/cronologia/' | relative_url }}"{% if page.url contains '/cronologia/' %} class="active"{% endif %}>Cronología</a>
  </nav>
  <div class="search-wrap">
    <input type="text" id="global-search" placeholder="Buscar… (personas, lugares, palabras)" autocomplete="off" data-index-url="{{ '/assets/data/search-index.json' | relative_url }}">
    <div class="results" id="search-results" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:30; margin-top:0.4rem;"></div>
  </div>
</header>
